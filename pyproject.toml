[project]
name = "sowwic-nyx-bridge"
version = "1.0.0"
description = "TCP bridge between Nyx and external processes (Blender, Maya, any Python)"
authors = [
    {name = "sowwic",email = "47799401+sowwic@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["nyx", "bridge", "tcp", "remote execution", "dcc", "maya", "blender"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/sowwic/nyx-bridge"
Documentation = "https://sowwic.github.io/nyx-bridge/"
Issues = "https://github.com/sowwic/nyx-bridge/issues"
Changelog = "https://github.com/sowwic/nyx-bridge/blob/main/CHANGELOG.rst"

[tool.uv.build-backend]
module-name = "nyx_bridge"

[build-system]
requires = ["uv_build>=0.10.6"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "ruff",
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.7.0,<10.0.0)",
    "mkdocstrings[python] (>=1.0.0,<2.0.0)",
    "mkdocs-autorefs (>=1.4.3,<2.0.0)",
    "mkdocs-autoapi (>=0.4.1,<0.5.0)",
]

[tool.ruff]
src = ["src"]
target-version = "py311"
show-fixes = true
line-length = 89
lint.select = [
    "E",
    "F",
    "UP",
]
lint.ignore = [
    "D100",
    "D104",
    "D103",
]

[tool.pytest.ini_options]
addopts = "--cov=nyx_bridge"
log_cli = true
log_cli_level = "ERROR"

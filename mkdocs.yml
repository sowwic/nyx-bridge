site_name: nyx-bridge Documentation
site_description: TCP bridge between Nyx and external processes
site_author: Dmitrii Shevchenko
theme:
  name: material

markdown_extensions:
  - admonition
  - pymdownx.superfences

plugins:
  - search
  - mkdocs-autoapi:
      autoapi_dir: "src/nyx_bridge"
      autoapi_file_patterns:
        - "*.py"
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]
          options:
            docstring_style: google
            show_signature: true
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_category_heading: true
            merge_init_into_class: true
            show_if_no_docstring: true
  - autorefs

nav:
  - Home: index.md
  - User Guide:
      - user/index.md
      - Running code in a process: user/client.md
      - Sending code from a server: user/server.md
      - Finding the server: user/addresses.md
  - Developer Guide:
      - dev/index.md
      - Architecture: dev/architecture.md
      - Wire protocol: dev/protocol.md
      - Writing a client: dev/clients.md
      - Testing: dev/testing.md
      - Releasing: dev/releasing.md
